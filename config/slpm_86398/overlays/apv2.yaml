name: japanese_apv2
sha1: 02fe472ce4f57133ab8719ac2784cae56066961e

options:
  basename: japanese_apv2
  base_path: ../../..
  target_path: tmp/overlays/japanese_apv2/module.bin
  elf_path: tmp/overlays/japanese_apv2/build/japanese_apv2.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/overlays/japanese_apv2/asm
  src_path: src
  build_path: tmp/overlays/japanese_apv2/build
  asset_path: tmp/overlays/japanese_apv2/assets
  cache_path: tmp/overlays/japanese_apv2/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/overlays/japanese_apv2/japanese_apv2.ld
  generated_asm_macros_directory: tmp/overlays/japanese_apv2/include
  lib_path: tmp/overlays/japanese_apv2/lib
  o_path: tmp/overlays/japanese_apv2/build
  undefined_funcs_auto_path: tmp/overlays/japanese_apv2/undefined_funcs_auto.txt
  undefined_syms_auto_path: tmp/overlays/japanese_apv2/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/slpm_86398/overlays/apv2_symbols.txt

  find_file_boundaries: false
  check_consecutive_segment_types: false
  o_as_suffix: true
  use_legacy_include_asm: false
  create_asm_dependencies: true
  ld_dependencies: true
  subalign: 2

  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    - ".sdata"
    - ".sbss"
    - ".bss"

segments:
  - name: module_header
    type: code
    start: 0x0
    vram: 0x80168000
    align: 4
    subsegments:
      - [0x0, data, overlays/apv2/module_header]

  - name: module
    type: code
    start: 0xF4
    vram: 0x801680F4
    align: 4
    subsegments:
      - [0xF4, asm, overlays/apv2/apv2]
      - [0x140C, data, overlays/apv2/data]

  - [0x1800]
