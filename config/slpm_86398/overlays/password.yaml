name: japanese_password
sha1: 5fc97da6cd0085dcbbaccbce8a9b69e76be6de08

options:
  basename: japanese_password
  base_path: ../../..
  target_path: tmp/overlays/japanese_password/module.bin
  elf_path: tmp/overlays/japanese_password/build/japanese_password.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/overlays/japanese_password/asm
  src_path: src
  build_path: tmp/overlays/japanese_password/build
  asset_path: tmp/overlays/japanese_password/assets
  cache_path: tmp/overlays/japanese_password/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/overlays/japanese_password/japanese_password.ld
  generated_asm_macros_directory: tmp/overlays/japanese_password/include
  lib_path: tmp/overlays/japanese_password/lib
  o_as_suffix: true
  undefined_funcs_auto_path: tmp/overlays/japanese_password/undefined_funcs_auto.txt
  undefined_syms_auto_path: tmp/overlays/japanese_password/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/slpm_86398/overlays/password_symbols.txt

  find_file_boundaries: false
  check_consecutive_segment_types: false
  use_legacy_include_asm: false
  create_asm_dependencies: true
  ld_dependencies: true
  extensions_path: tools/splat_extensions
  subalign: 2

  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    - ".sdata"
    - ".sbss"
    - ".bss"

segments:
  - name: module_header
    type: code
    start: 0x0
    vram: 0x80168000
    align: 4
    subsegments:
      - [0x0, .data, overlays/password/module_header]

  - name: module
    type: code
    start: 0x4
    vram: 0x80168004
    # The module state ends on a halfword (+0x51E6).
    align: 2
    subsegments:
      - [0x4, .rodata, overlays/password/shop]
      - [0x18, c, overlays/password/func_801680B4]
      - [0x9C, c, overlays/password/name_entry_runtime]
      - [0x198C, c, overlays/password/shop]
      - [0x2650, c, overlays/password/name_entry_main]
      - [0x2840, .data, overlays/password/name_entry_runtime]
      # Linker fill between objects, not data.
      - [0x28DA, bin, overlays/japanese_password/data_28da]
      - [0x28DC, .data, overlays/password/name_entry_main]
      # Linker fill between objects, not data.
      - [0x5104, bin, overlays/japanese_password/data_5104]
      - [0x5108, bss_commons, overlays/japanese_password/name_entry_runtime_commons]

  - name: leftover
    type: code
    start: 0x51E6
    vram: 0x8016D1E6
    align: 2
    subsegments:
      - [0x51E6, bin, overlays/japanese_password/data]

  - [0x7800]
