      - [0x1040, .data, overlays/options/options_screen]
      # Linker fill between objects, not data.
      - [0x104F, pad]
      - [0x1050, bss_commons, overlays/german_options/options_screen_commons]
  - name: unclassified_tail
    type: code
    start: 0x11FD
    vram: 0x801691FD
    align: 1
    subsegments:
