name: SLUS_014.11
sha1: 84747e64f6da8e764206ec203e489acf8c9dcf7d

options:
  basename: slus_01411
  base_path: ../..
  target_path: game/SLUS_014.11
  elf_path: tmp/splat/build/slus_01411.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/splat/asm
  src_path: src
  build_path: tmp/splat/build
  asset_path: tmp/splat/assets
  cache_path: tmp/splat/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/splat/slus_01411.ld
  generated_asm_macros_directory: tmp/splat/include
  lib_path: tmp/splat/lib
  o_path: tmp/splat/build
  undefined_funcs_auto_path: tmp/splat/undefined_funcs_auto.txt
  undefined_syms_auto_path: tmp/splat/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/slus_01411/symbols.txt
  reloc_addrs_path:
    - config/slus_01411/relocations.txt

  gp_value: 0x8009af08
  find_file_boundaries: false
  check_consecutive_segment_types: false
  o_as_suffix: true
  use_legacy_include_asm: false
  create_asm_dependencies: true
  ld_dependencies: true
  subalign: 2

  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    - ".sdata"
    - ".sbss"
    - ".bss"

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      # The region before the text is the compiler's read-only data. A
      # matching C function that owns some declares it here, the way the ff8
      # and silent-hill configurations do, and gaps are pad.
      - [0x800, rodata, initial_data]
      - [0xA24, .rodata, game/func_8002D458]
      - [0xA50, rodata, initial_data_1]
      - [0xB48, .rodata, game/func_8003B808]
      - [0xB5C, rodata, initial_data_1b]
      - [0x214C, .rodata, game/ai_get_winning_card_range]
      - [0x2168, pad]
      - [0x216C, .rodata, game/ai_get_card_range]
      - [0x2194, .rodata, game/ai_script_calc_card_power]
      - [0x21A8, rodata, initial_data_2]




  # The text and everything after it is its own segment, because Splat lays
  # out one output section per segment and groups by section_order inside it.
  # Kept as one segment the initialized data would be hoisted in front of the
  # text, since both are .data, and every symbol after it would move.
  - name: text
    type: code
    start: 0x31d8
    vram: 0x800129D8
    align: 4
    subsegments:
      - [0x31d8, asm, entry]
      - [0x80ed4, pad]

  # Every region below is a segment for the same reason: one output section
  # each, at its own address, so nothing is reordered across them.
  - name: initialized_data
    type: data
    start: 0x80ee0
    vram: 0x800906E0
    align: 4
    subsegments:
      - [0x80ee0, data, initialized_data]

  - name: bss_image
    type: bin
    start: 0x8b890
    vram: 0x8009B090
    align: 4
    subsegments:
      - [0x8b890, bin, bss_image]

  - name: reserved_zero
    type: bin
    start: 0xeef28
    vram: 0x800FE728
    align: 4
    subsegments:
      - [0xeef28, bin, reserved_zero]

  # One segment per slot, so Splat keeps writing one asset per overlay for
  # the overlay tooling to read.
  - name: overlays/slot_8013a000
    type: bin
    start: 0x12a800
    vram: 0x8013A000
    align: 4
    subsegments:
      - [0x12a800, bin, overlays/slot_8013a000]

  - name: overlays/slot_80146000
    type: bin
    start: 0x136800
    vram: 0x80146000
    align: 4
    subsegments:
      - [0x136800, bin, overlays/slot_80146000]

  - name: overlays/slot_80168000
    type: bin
    start: 0x158800
    vram: 0x80168000
    align: 4
    subsegments:
      - [0x158800, bin, overlays/slot_80168000]

  - name: overlays/slot_8017a000
    type: bin
    start: 0x16a800
    vram: 0x8017A000
    align: 4
    subsegments:
      - [0x16a800, bin, overlays/slot_8017a000]

  - name: overlays/slot_80180000
    type: bin
    start: 0x170800
    vram: 0x80180000
    align: 4
    subsegments:
      - [0x170800, bin, overlays/slot_80180000]

  - name: tail_data
    type: bin
    start: 0x19c800
    vram: 0x801AC000
    align: 4
    subsegments:
      - [0x19c800, bin, tail_data]

  - [0x1d0800]
