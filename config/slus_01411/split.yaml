segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      # The region before the text is the compiler's read-only data:
      # strings, tables and switch jump tables. A matching C function that
      # owns a jump table declares it here, the way the ff8 and
      # silent-hill configurations do, and gaps are pad rather than data.
      - [0x800, data, initial_data]

  # Each piece of the read-only region is its own segment for the same reason
  # the text is: Splat orders by section_order within a segment, so a .rodata
  # subsegment sharing a segment with .data is moved behind it.
  # The compiler marks a jump table eight byte aligned; retail places it on a
  # four byte boundary, so the input alignment is overridden here.
  - name: rodata_00214c
    type: code
    subalign: 4
    start: 0x214C
    vram: 0x8001194C
    align: 4
    subsegments:
      # The gap to the next segment is padding between two output sections,
      # each of which has its own explicit address, so it needs no subsegment.
      - [0x214C, .rodata, game/ai_get_winning_card_range]

  # The compiler marks a jump table eight byte aligned; retail places it on a
  # four byte boundary, so the input alignment is overridden here.
  - name: rodata_00216c
    type: code
    subalign: 4
    start: 0x2168
    vram: 0x80011968
    align: 4
    subsegments:
      # The four byte gap belongs at the head of this segment, where the
      # section order puts it ahead of the rodata rather than behind it.
      - [0x2168, pad]
      - [0x216C, .rodata, game/ai_get_card_range]

  - name: initial_data_2
    type: data
    start: 0x2194
    vram: 0x80011994
    align: 4
    subsegments:
      - [0x2194, data, initial_data_2]

  # The text and everything after it is its own segment, because Splat lays
  # out one output section per segment and groups by section_order inside it.
  # Kept as one segment the initialized data would be hoisted in front of the
  # text, since both are .data, and every symbol after it would move.
  - name: text
    type: code
    start: 0x31d8
    vram: 0x800129D8
    align: 4
    subsegments:
      - [0x31d8, asm, entry]
      - [0x80ed4, pad]

  # Every region below is a segment for the same reason: one output section
  # each, at its own address, so nothing is reordered across them.
  - name: initialized_data
    type: data
    start: 0x80ee0
    vram: 0x800906E0
    align: 4
    subsegments:
      - [0x80ee0, data, initialized_data]

  - name: bss_image
    type: bin
    start: 0x8b890
    vram: 0x8009B090
    align: 4
    subsegments:
      - [0x8b890, bin, bss_image]

  - name: reserved_zero
    type: bin
    start: 0xeef28
    vram: 0x800FE728
    align: 4
    subsegments:
      - [0xeef28, bin, reserved_zero]

  - name: overlay_slots
    type: bin
    start: 0x12a800
    vram: 0x8013A000
    align: 4
    subsegments:
      - [0x12a800, bin, overlays/slot_8013a000]
      - [0x136800, bin, overlays/slot_80146000]
      - [0x158800, bin, overlays/slot_80168000]
      - [0x16a800, bin, overlays/slot_8017a000]
      - [0x170800, bin, overlays/slot_80180000]

  - name: tail_data
    type: bin
    start: 0x19c800
    vram: 0x801AC000
    align: 4
    subsegments:
      - [0x19c800, bin, tail_data]

  - [0x1d0800]
