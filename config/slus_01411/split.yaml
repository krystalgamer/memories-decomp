      - [0x21A8, rodata, initial_data_2]




  # The text and everything after it is its own segment, because Splat lays
  # out one output section per segment and groups by section_order inside it.
  # Kept as one segment the initialized data would be hoisted in front of the
  # text, since both are .data, and every symbol after it would move.
  - name: text
    type: code
    start: 0x31d8
    vram: 0x800129D8
    align: 4
    subsegments:
      - [0x31d8, asm, entry]
      - [0x80ed4, pad]

  # Every region below is a segment for the same reason: one output section
  # each, at its own address, so nothing is reordered across them.

  # Initialized-data ranges are code groups so their .data and .sdata
  # contributions can be mapped to C independently, declared the way the
  # leading read-only region is, one entry per owning object. Once .sdata
  # begins, every following extracted range must also be classified as sdata
  # so section_order preserves the GP-relative sequence. Everything still
  # without an owner stays a generated blob, named for the address it starts
  # at so taking ownership of one range never renames another.
  - name: initialized_data
    type: code
    start: 0x80ee0
    vram: 0x800906E0
    align: 4
    subsegments:
