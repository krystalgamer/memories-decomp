name: main_menu
sha1: 5a6aa8abe6768b0f6beef0d75376bdb087b87572

options:
  basename: main_menu
  base_path: ../../..
  target_path: tmp/overlays/main_menu/module.bin
  elf_path: tmp/overlays/main_menu/build/main_menu.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/overlays/main_menu/asm
  src_path: src
  build_path: tmp/overlays/main_menu/build
  asset_path: tmp/overlays/main_menu/assets
  cache_path: tmp/overlays/main_menu/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/overlays/main_menu/main_menu.ld
  generated_asm_macros_directory: tmp/overlays/main_menu/include
  lib_path: tmp/overlays/main_menu/lib
  o_path: tmp/overlays/main_menu/build
  undefined_funcs_auto_path: tmp/overlays/main_menu/undefined_funcs_auto.txt
  undefined_syms_auto_path: tmp/overlays/main_menu/undefined_syms_auto.txt

  symbol_addrs_path:
    - notes/research/Unchiga_Symbols/modules/main_menu.txt
    - config/slus_01411/overlays/main_menu_symbols.txt

  find_file_boundaries: false
  check_consecutive_segment_types: false
  o_as_suffix: true
  use_legacy_include_asm: false
  create_asm_dependencies: true
  ld_dependencies: true
  subalign: 2

  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    - ".sdata"
    - ".sbss"
    - ".bss"

segments:
  - name: module_header
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subsegments:
      - [0x0, data, overlays/main_menu/module_header]


  - name: module
    type: code
    start: 0x4
    vram: 0x80180004
    align: 4
    subsegments:
      - [0x4, rodata, overlays/main_menu/module_rodata]
      - [0x1C, c, overlays/main_menu/frontend]
      - [0xFD8, c, overlays/main_menu/value_setup]
      - [0x1F68, c, overlays/main_menu/trade_update]
      - [0x3514, c, overlays/main_menu/card_stat_comparators]
      - [0x3B2C, c, overlays/main_menu/trade_offers]
      - [0x416C, c, overlays/main_menu/card_name_count_comparators]
      - [0x4344, c, overlays/main_menu/trade_screen_helpers]
      - [0x4558, data, overlays/main_menu/data]

  - [0x8000]
