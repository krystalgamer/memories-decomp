segments:
  - name: module_header
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subsegments:
      - [0x0, data, overlays/french_main_menu/header]

  - name: module
    type: code
    start: 0x4
    vram: 0x80180004
    align: 4
    subsegments:
      - [0x4, rodata, overlays/french_main_menu/rodata]
      - [0x1C, c, overlays/main_menu/frontend]
      - [0x1050, c, overlays/main_menu/value_setup]
      - [0x20C0, c, overlays/main_menu/trade_screen]
      - [0x4784, data, overlays/french_main_menu/data]

  - [0x8000]
