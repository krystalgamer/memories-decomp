  target_path: tmp/overlays/french_main_menu/module.bin
  elf_path: tmp/overlays/french_main_menu/build/french_main_menu.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/overlays/french_main_menu/asm
  src_path: src
  build_path: tmp/overlays/french_main_menu/build
  asset_path: tmp/overlays/french_main_menu/assets
  cache_path: tmp/overlays/french_main_menu/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/overlays/french_main_menu/french_main_menu.ld
  generated_asm_macros_directory: tmp/overlays/french_main_menu/include
  lib_path: tmp/overlays/french_main_menu/lib
