name: italian_main_menu
sha1: 24826023592b25f7d6f7bafd70b741e3f0cb84bc

options:
  basename: italian_main_menu
  base_path: ../../..
  target_path: tmp/overlays/italian_main_menu/module.bin
  elf_path: tmp/overlays/italian_main_menu/build/italian_main_menu.elf
  platform: psx
  compiler: PSYQ
  endianness: little

  asm_path: tmp/overlays/italian_main_menu/asm
  src_path: src
  build_path: tmp/overlays/italian_main_menu/build
  asset_path: tmp/overlays/italian_main_menu/assets
  cache_path: tmp/overlays/italian_main_menu/cache
  data_path: data
  nonmatchings_path: nonmatchings
  matchings_path: matchings

  ld_script_path: tmp/overlays/italian_main_menu/italian_main_menu.ld
  generated_asm_macros_directory: tmp/overlays/italian_main_menu/include
  lib_path: tmp/overlays/italian_main_menu/lib
  o_path: tmp/overlays/italian_main_menu/build
  undefined_funcs_auto_path: tmp/overlays/italian_main_menu/undefined_funcs_auto.txt
  undefined_syms_auto_path: tmp/overlays/italian_main_menu/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/sles_03950/overlays/main_menu_symbols.txt

  find_file_boundaries: false
  check_consecutive_segment_types: false
  o_as_suffix: true
  use_legacy_include_asm: false
  create_asm_dependencies: true
  ld_dependencies: true
  subalign: 2

  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    - ".sdata"
    - ".sbss"
    - ".bss"

segments:
  - name: module_header
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subsegments:
      - [0x0, data, overlays/italian_main_menu/header]

  - name: module
    type: code
    start: 0x4
    vram: 0x80180004
    align: 4
    subsegments:
      - [0x4, rodata, overlays/italian_main_menu/rodata]
      - [0x1C, c, overlays/european/main_menu/frontend]
      - [0x1050, c, overlays/european/main_menu/start_value_setup]
      - [0x1408, c, overlays/european/main_menu/update_value_setup]
      - [0x187C, c, overlays/european/main_menu/draw_value_setup]
      - [0x1E10, c, overlays/european/main_menu/update_value_widget_tween]
      - [0x1F88, c, overlays/european/main_menu/finish_value_setup]
      - [0x2044, c, overlays/european/main_menu/count_decimal_digits]
      - [0x2078, c, overlays/european/main_menu/start_value_widget_tween]
      - [0x20C0, c, overlays/european/main_menu/trade_screen]
      - [0x4784, data, overlays/italian_main_menu/data]

  - [0x8000]
