name: Regional retail inputs
description: Restore the shared encrypted bundle and stage hash-verified regional inputs
inputs:
  cache-key:
    description: Exact prepared cache key from the coordinating workflow
    default: ""
  prepare:
    description: Prepare the cache in this job only for standalone manual runs
    default: "false"
  url:
    description: Private HTTPS ZIP URL
    required: true
  username:
    description: HTTP basic authentication username
    required: true
  password:
    description: HTTP basic authentication password
    required: true
  region:
    description: Regional game directory
    required: true
  archives-only:
    description: Stage SU, WA, MODEL and additional configured overlay archives without the resident executable
    default: "false"
  executable-only:
    description: Stage only the resident executable, without requiring overlay archives
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare inputs for a standalone manual build
      if: inputs.prepare == 'true'
      uses: ./.github/actions/prepare-retail-inputs
      with:
        url: ${{ inputs.url }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Restore prepared encrypted retail bundle
      if: inputs.prepare != 'true'
      uses: actions/cache/restore@v4
      with:
        path: tmp/ci-retail-cache/ci-files.zip.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true

    - name: Decrypt and verify selected retail inputs
      shell: bash
      env:
        YGOFM_CI_FILES: ${{ inputs.url }}
        YGOFM_CI_FILES_USERNAME: ${{ inputs.username }}
        YGOFM_CI_FILES_PASSWORD: ${{ inputs.password }}
        INPUT_REGION: ${{ inputs.region }}
        ARCHIVES_ONLY: ${{ inputs.archives-only }}
        EXECUTABLE_ONLY: ${{ inputs.executable-only }}
        PREPARE_INPUTS: ${{ inputs.prepare }}
      run: |
        set -euo pipefail
        case "$PREPARE_INPUTS" in
          true|false) ;;
          *) echo "::error::prepare must be true or false."; exit 1 ;;
        esac
        for name in YGOFM_CI_FILES YGOFM_CI_FILES_USERNAME YGOFM_CI_FILES_PASSWORD
        do
          if [ -z "$(printenv "$name")" ]; then
            echo "::error::Configure the $name repository secret."
            exit 1
          fi
        done
        arguments=(--region "$INPUT_REGION")
        case "$ARCHIVES_ONLY" in
          true) arguments+=(--archives-only) ;;
          false) ;;
          *) echo "::error::archives-only must be true or false."; exit 1 ;;
        esac
        case "$EXECUTABLE_ONLY" in
          true) arguments+=(--executable-only) ;;
          false) ;;
          *) echo "::error::executable-only must be true or false."; exit 1 ;;
        esac
        PYTHONPYCACHEPREFIX="$PWD/tmp/pycache" \
          python3 tools/project/ci_bundle.py stage "${arguments[@]}"
