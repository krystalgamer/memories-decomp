name: Matching build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths-ignore:
      - "notes/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matching-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MAKEFLAGS: -j2
      USE_SYSTEM_MIPS_BINUTILS: "1"
      SLUS_URL: ${{ secrets.YGOFM_SLUS_01411_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates \
            curl \
            git \
            patch \
            python3-pip \
            python3-venv

      - name: Require private retail input secrets
        run: |
          if [ -z "$SLUS_URL" ]; then
            echo "::error::Configure the YGOFM_SLUS_01411_URL repository secret."
            exit 1
          fi

      - name: Download and verify retail executable
        run: |
          mkdir -p game
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$SLUS_URL" \
            --output game/SLUS_014.11
          printf '%s  %s\n' \
            84a54ed74f3d0edd6d81380839f7e4ef5bfb21ecea18be9a062bd6bfa5a45c88 \
            game/SLUS_014.11 \
            | sha256sum --check --strict

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          make python-tools
          make toolchain-system
          make compiler-281-prebuilt
          make check-build-tools

      - name: Perform clean matching build
        run: |
          make clean
          make match check-progress
          printf '%s  %s\n' \
            84a54ed74f3d0edd6d81380839f7e4ef5bfb21ecea18be9a062bd6bfa5a45c88 \
            tmp/project-build/SLUS_014.11 \
            | sha256sum --check --strict
