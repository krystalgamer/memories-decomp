name: Metadata

# Deliberately unfiltered, and deliberately minimal. These checks use only
# tracked text and standard-library temporary fixtures, so they need no retail
# input, no toolchain, no bootstrapped Python and no secrets -- which lets this
# job watch every path, including the notes/** the overlay build ignores.
#
# A check that no workflow runs is a checklist item with extra steps. The
# headline drift these catch accumulated for exactly that reason: the targets
# existed and nothing invoked them. `check-candidate-index` is deliberately not
# listed because `check-metadata` already runs the same
# `candidate_files.py --check`.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tracked metadata
        run: make check-metadata

      - name: Verify candidate headlines match their inventory rows
        run: make check-candidate-headlines

      - name: Verify every C source uses the shared basic types
        run: make basic-types

      - name: Verify inventory classification regressions
        run: |
          PYTHONPYCACHEPREFIX="$PWD/tmp/pycache" python3 -m unittest discover \
            -s tools/project/tests -p 'test_function_inventory.py' -v
