name: French matching build

on:
  workflow_call:
    inputs:
      retail-cache-key:
        description: Exact encrypted cache prepared by the coordinating build workflow
        required: true
        type: string
      coordinated:
        description: Reusable calls restore only; standalone manual runs prepare their own cache
        default: true
        type: boolean
    secrets:
      YGOFM_CI_FILES:
        required: true
      YGOFM_CI_FILES_USERNAME:
        required: true
      YGOFM_CI_FILES_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-matching-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MAKEFLAGS: -j4
      USE_SYSTEM_MIPS_BINUTILS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates curl patch python3-pip python3-venv

      - name: Restore and verify French retail inputs
        uses: ./.github/actions/retail-inputs
        with:
          cache-key: ${{ inputs.retail-cache-key }}
          prepare: ${{ !inputs.coordinated }}
          region: france
          url: ${{ secrets.YGOFM_CI_FILES }}
          username: ${{ secrets.YGOFM_CI_FILES_USERNAME }}
          password: ${{ secrets.YGOFM_CI_FILES_PASSWORD }}

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          python3 tools/bootstrap/bootstrap.py
          python3 tools/bootstrap/binutils_system.py
          python3 tools/bootstrap/old_gcc_prebuilt.py
          make check-build-tools

      - name: Verify French inputs and clean exact build
        run: |
          make verify-french-inputs
          make french-match
          sha256sum --check --strict <<'EOF'
          57ecdfb9a9e1faf8b342fe7c7304c23723810861f3ab2fa3bef9eb27b5146b44  tmp/project-build/SLES_039.48
          EOF
