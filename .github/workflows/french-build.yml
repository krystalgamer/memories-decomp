name: French matching build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-matching-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MAKEFLAGS: -j4
      USE_SYSTEM_MIPS_BINUTILS: "1"
      YGOFM_SLES_03948_URL: ${{ secrets.YGOFM_SLES_03948_URL }}
      YGOFM_FRA_SU_MRG_URL: ${{ secrets.YGOFM_FRA_SU_MRG_URL }}
      YGOFM_FRA_WA_MRG_URL: ${{ secrets.YGOFM_FRA_WA_MRG_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates curl patch python3-pip python3-venv

      - name: Require private French retail input secrets
        run: |
          for name in \
            YGOFM_SLES_03948_URL \
            YGOFM_FRA_SU_MRG_URL \
            YGOFM_FRA_WA_MRG_URL
          do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Configure the corresponding YGOFM French input secret."
              exit 1
            fi
          done

      - name: Download and verify French retail inputs
        run: |
          mkdir -p game/france/DATA
          curl --fail --location --retry 3 --silent --show-error \
            "$YGOFM_SLES_03948_URL" --output game/france/SLES_039.48
          curl --fail --location --retry 3 --silent --show-error \
            "$YGOFM_FRA_SU_MRG_URL" --output game/france/DATA/SU.MRG
          curl --fail --location --retry 3 --silent --show-error \
            "$YGOFM_FRA_WA_MRG_URL" --output game/france/DATA/WA_MRG.MRG
          sha256sum --check --strict config/sles_03948/files.sha256

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          python3 tools/bootstrap/bootstrap.py
          python3 tools/bootstrap/binutils_system.py
          python3 tools/bootstrap/old_gcc_prebuilt.py
          make check-build-tools

      - name: Verify French inputs and clean exact build
        run: |
          make verify-french-inputs
          make french-match
          sha256sum --check --strict <<'EOF'
          57ecdfb9a9e1faf8b342fe7c7304c23723810861f3ab2fa3bef9eb27b5146b44  tmp/project-build/SLES_039.48
          EOF
