name: German matching build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "notes/**"
      - "README.md"
      - "tools/trace/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "notes/**"
      - "README.md"
      - "tools/trace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: german-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-resident:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MAKEFLAGS: -j4
      USE_SYSTEM_MIPS_BINUTILS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates curl python3-pip python3-venv

      - name: Download and verify German retail inputs
        uses: ./.github/actions/retail-inputs
        with:
          region: germany
          url: ${{ secrets.YGOFM_CI_FILES }}
          username: ${{ secrets.YGOFM_CI_FILES_USERNAME }}
          password: ${{ secrets.YGOFM_CI_FILES_PASSWORD }}

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          python3 tools/bootstrap/bootstrap.py
          python3 tools/bootstrap/binutils_system.py
          python3 tools/bootstrap/old_gcc_prebuilt.py
          make check-build-tools

      - name: Verify German inputs and exact resident build
        run: |
          make verify-german-inputs
          make german-match
