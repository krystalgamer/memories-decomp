name: Overlay build

on:
  # Dispatch only, and deliberately so. Do not add push or pull_request here.
  #
  # This job downloads retail inputs from private URLs held in repository
  # secrets. GitHub withholds secrets from pull_request runs raised from a
  # fork, so an outside contribution would fail the secret guard rather than
  # build; and pull_request_target would hand fork-authored code a job that
  # can read those URLs, which is a worse trade than having no automatic
  # check at all.
  #
  # Overlay byte-exactness is therefore established by the author running
  # make match-overlays locally, and, for an outside contribution, by a
  # maintainer dispatching this workflow against the reviewed head. Changing
  # that needs an approval-gated job rather than a different trigger.
  #
  # See #375 for the full reasoning.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-overlays:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MAKEFLAGS: -j2
      USE_SYSTEM_MIPS_BINUTILS: "1"
      SLUS_URL: ${{ secrets.YGOFM_SLUS_01411_URL }}
      WA_MRG_URL: ${{ secrets.YGOFM_WA_MRG_URL }}
      SU_MRG_URL: ${{ secrets.YGOFM_SU_MRG_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates \
            curl \
            python3-pip \
            python3-venv

      - name: Require private retail input secrets
        run: |
          if [ -z "$SLUS_URL" ]; then
            echo "::error::Configure the YGOFM_SLUS_01411_URL repository secret."
            exit 1
          fi
          if [ -z "$WA_MRG_URL" ]; then
            echo "::error::Configure the YGOFM_WA_MRG_URL repository secret."
            exit 1
          fi
          if [ -z "$SU_MRG_URL" ]; then
            echo "::error::Configure the YGOFM_SU_MRG_URL repository secret."
            exit 1
          fi

      - name: Download and verify retail inputs
        run: |
          mkdir -p game/DATA
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$SLUS_URL" \
            --output game/SLUS_014.11
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$WA_MRG_URL" \
            --output game/DATA/WA_MRG.MRG
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$SU_MRG_URL" \
            --output game/DATA/SU.MRG
          printf '%s  %s\n' \
            84a54ed74f3d0edd6d81380839f7e4ef5bfb21ecea18be9a062bd6bfa5a45c88 \
            game/SLUS_014.11 \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            a519a1f5b27f4c6702613ba48c10bf945d25c9c51611ae3d2fab6e5d562b2d66 \
            game/DATA/WA_MRG.MRG \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            c34d1eef2445e15ed40d20ad325c9907c55123d03f35b8693e7031966ef52e51 \
            game/DATA/SU.MRG \
            | sha256sum --check --strict

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          make python-tools
          make toolchain-system
          make compiler-281-prebuilt
          make check-build-tools

      - name: Perform exact overlay build
        run: make match-overlays
