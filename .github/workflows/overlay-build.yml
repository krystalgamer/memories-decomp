name: Overlay build

on:
  workflow_call:
    inputs:
      retail-cache-key:
        description: Exact encrypted cache prepared by the coordinating build workflow
        required: true
        type: string
      coordinated:
        description: Reusable calls restore only; standalone manual runs prepare their own cache
        default: true
        type: boolean
    secrets:
      YGOFM_CI_FILES:
        required: true
      YGOFM_CI_FILES_USERNAME:
        required: true
      YGOFM_CI_FILES_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-overlays:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      USE_SYSTEM_MIPS_BINUTILS: "1"

    steps:
      - name: Select build parallelism
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      - name: Install host build dependencies
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft) that this build never installs from. When one of them
          # serves a Release file that disagrees with its Packages index,
          # apt-get update exits 100 and the job dies before compiling
          # anything. Drop those sources -- they appear as .list or as
          # deb822 .sources depending on the image -- and do not let a
          # surviving index failure be fatal. The apt-get install below is
          # the real gate: it fails loudly if an index it needs is missing.
          sudo rm -f /etc/apt/sources.list.d/*.list \
                     /etc/apt/sources.list.d/*.sources
          sudo apt-get update || true
          sudo apt-get install --yes --no-install-recommends \
            binutils-mips-linux-gnu=2.38-1ubuntu1cross2 \
            ca-certificates \
            curl \
            python3-pip \
            python3-venv

      - name: Restore and verify retail inputs
        uses: ./.github/actions/retail-inputs
        with:
          cache-key: ${{ inputs.retail-cache-key }}
          prepare: ${{ !inputs.coordinated }}
          region: usa
          url: ${{ secrets.YGOFM_CI_FILES }}
          username: ${{ secrets.YGOFM_CI_FILES_USERNAME }}
          password: ${{ secrets.YGOFM_CI_FILES_PASSWORD }}

      - name: Restore pinned project tools
        uses: actions/cache@v4
        with:
          path: |
            tools/downloads
            tools/environments
            tools/toolchains
            tools/vendor
          key: ${{ runner.os }}-project-tools-${{ hashFiles('tools/bootstrap/*.json', 'tools/bootstrap/*.py') }}

      - name: Install or verify pinned tools
        run: |
          make python-tools
          make toolchain-system
          make compiler-281-prebuilt
          make compiler-272-prebuilt
          make check-build-tools

      - name: Verify tracked metadata
        run: |
          make overlays
          make verify-overlays

      - name: Perform exact overlay build
        run: make match-overlays
